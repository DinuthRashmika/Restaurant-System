# ============================================================================
# CI Pipeline - Build & Test All Backend Microservices
# Triggers on every push and pull request to main_ branch
# ============================================================================

name: CI - Build & Test

on:
  push:
    branches: [ "main_" ]
  pull_request:
    branches: [ "main_" ]

jobs:
  build-backend:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: user-service
            path: apps/user-service/user
          - service: menu-service
            path: apps/menu-service/menu
          - service: order-service
            path: apps/order-service/order
          - service: notify-service
            path: apps/notify-service/notify

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests
        working-directory: ${{ matrix.path }}

      - name: Run Tests
        run: mvn test
        working-directory: ${{ matrix.path }}
        continue-on-error: true
