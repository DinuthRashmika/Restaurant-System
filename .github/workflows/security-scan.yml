# ============================================================================
# Security Scanning Pipeline (DevSecOps)
# Integrates Snyk SAST for code analysis and dependency scanning
# for all 4 backend microservices
# ============================================================================

name: Security Scan - Snyk

on:
  push:
    branches: [ "main_" ]
  pull_request:
    branches: [ "main_" ]

permissions:
  contents: read
  security-events: write

jobs:
  # ─────────────────────────────────────────────────────────────
  # Snyk Code - Static Application Security Testing (SAST)
  # Scans source code for security vulnerabilities
  # ─────────────────────────────────────────────────────────────
  snyk-code-scan:
    name: Snyk SAST - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            path: apps/user-service/user
          - service: menu-service
            path: apps/menu-service/menu
          - service: order-service
            path: apps/order-service/order
          - service: notify-service
            path: apps/notify-service/notify

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk Code Test (SAST)
        run: snyk code test ${{ matrix.path }} --severity-threshold=high || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Snyk Code Test (SARIF output)
        run: snyk code test ${{ matrix.path }} --sarif-file-output=snyk-code-${{ matrix.service }}.sarif || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload SAST results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-code-${{ matrix.service }}.sarif
          category: snyk-code-${{ matrix.service }}

  # ─────────────────────────────────────────────────────────────
  # Snyk Open Source - Dependency Vulnerability Scanning
  # Scans Maven dependencies for known vulnerabilities
  # ─────────────────────────────────────────────────────────────
  snyk-dependency-scan:
    name: Snyk Dependencies - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            path: apps/user-service/user
          - service: menu-service
            path: apps/menu-service/menu
          - service: order-service
            path: apps/order-service/order
          - service: notify-service
            path: apps/notify-service/notify

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build project for dependency resolution
        run: mvn clean install -DskipTests
        working-directory: ${{ matrix.path }}

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk Open Source Test
        run: |
          cd ${{ matrix.path }}
          snyk test --severity-threshold=high --sarif-file-output=../../../snyk-deps-${{ matrix.service }}.sarif || true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Upload dependency scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk-deps-${{ matrix.service }}.sarif
          category: snyk-deps-${{ matrix.service }}
