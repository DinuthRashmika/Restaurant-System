# ============================================================================
# Deploy User Service Container App to Azure
# ============================================================================

name: Deploy User Service Container App to Azure

on:
  push:
    branches:
      - main_
    paths:
      - 'apps/user-service/user/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # ── STEP 1 - Downloads repository code onto the Linux machine
      - name: Checkout code
        uses: actions/checkout@v3

      # ── STEP 2 - Installs Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── STEP 3 - Compiles code and creates a .jar file
      - name: Build jar with Maven
        run: mvn clean package -DskipTests
        working-directory: apps/user-service/user

      # ── STEP 4 - Logs in to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.USER_DOCKER_USERNAME }}
          password: ${{ secrets.USER_DOCKER_PASSWORD }}

      # ── STEP 5 - Builds a Docker image from your Dockerfile
      - name: Build Docker image
        run: docker build -t ${{ secrets.USER_DOCKER_USERNAME }}/user-service:latest .
        working-directory: apps/user-service/user

      # ── STEP 6 - Uploads (pushes) the Docker image to Docker Hub
      - name: Push to Docker Hub
        run: docker push ${{ secrets.USER_DOCKER_USERNAME }}/user-service:latest

      # ── STEP 7 - Logs in to your Azure account
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.USER_AZURE_CREDENTIALS }}

      # ── STEP 8 - Azure Container Apps to pull the new Docker image and restart your app
      - name: Deploy to Azure Container Apps
        run: |
          az containerapp update \
            --name user-service \
            --resource-group pamalis-group \
            --image ${{ secrets.USER_DOCKER_USERNAME }}/user-service:latest
